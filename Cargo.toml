[package]
name = "agentstat"
version = "0.1.1"
edition = "2024"
description = "Read-only AI provider usage, quota, balance, and reset data"
license = "MIT"
readme = "README.md"
repository = "https://github.com/dhanushk-offl/agentstat"
homepage = "https://github.com/dhanushk-offl/agentstat"
documentation = "https://docs.rs/agentstat"
keywords = ["ai", "usage", "quota", "codex", "claude"]
categories = ["api-bindings", "asynchronous"]

[features]
default = ["codex", "claude"]
local-files = []
local-probes = ["local-files", "tokio/process", "dep:nix"]
opencode-local = ["opencode", "local-probes"]
all-providers = ["codex", "openai", "azureopenai", "claude", "clinepass", "cursor", "opencode", "opencodego", "alibaba", "alibabatokenplan", "qwencloud", "factory", "fireworks", "gemini", "antigravity", "copilot", "devin", "zai", "minimax", "manus", "kimi", "kilo", "kiro", "vertexai", "augment", "jetbrains", "moonshot", "amp", "t3chat", "langdock", "ollama", "synthetic", "openrouter", "elevenlabs", "warp", "windsurf", "zed", "perplexity", "mimo", "doubao", "sakana", "abacus", "mistral", "deepseek", "deepinfra", "codebuff", "venice", "commandcode", "qoder", "stepfun", "bedrock", "grok", "groq", "llmproxy", "litellm", "bifrost", "aixy", "deepgram", "poe", "chutes", "neuralwatt", "helmcode", "clawrouter", "longcat", "sub2api", "wayfinder", "zenmux", "aiand", "zoommate", "xai", "xapi", "notion", "ibmbob", "nous", "muse", "coderabbit", "replicate", "huggingface", "raycast", "pi", "v0", "typesafe", "hyper", "gitkraken", "futureagi", "devpass", "atlascloud", "vercel", "llmman", "xkiro", "museai", "lithosai", "workbuddy", "tavily", "linkup", "tinyapi", "exa", "cosmic", "aerostack", "sailresearch", "sofya", "fal", "flora", "parallel", "claudeplatform", "munito"]
